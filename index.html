<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f2d22">
  <title>골프 레슨 영어</title>
  <meta name="description" content="클럽별 레슨 상황 영어 문장 80개를 한국어 버튼으로 듣고, 날짜 제한 없이 마음껏 연습해요.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="골프영어">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true" focusable="false">
        <path d="M9 3v25" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" fill="none"/>
        <path d="M10.3 4.4 27 10.2 10.3 16z" fill="#ff7a66"/>
        <ellipse cx="9" cy="29" rx="6" ry="1.7" fill="currentColor" opacity=".3"/>
      </svg>
      <span>골프 레슨 영어</span>
    </div>
    <nav class="tabs" aria-label="화면 선택">
      <button type="button" class="tab" data-view="clubs">클럽별</button>
      <button type="button" class="tab" data-view="practice">연습</button>
      <button type="button" class="tab" data-view="today">오늘</button>
      <button type="button" class="tab" data-view="sound">소리</button>
    </nav>
  </header>

  <main id="app">
    <section id="view-clubs" class="view" aria-label="클럽별 상황 학습" hidden></section>
    <section id="view-practice" class="view" aria-label="연습" hidden></section>
    <section id="view-today" class="view" aria-label="오늘의 한 문장" hidden></section>
    <section id="view-sound" class="view" aria-label="소리와 설정" hidden></section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <noscript><p style="padding:24px">이 앱은 JavaScript가 켜져 있어야 동작해요.</p></noscript>

  <script src="sentences.js"></script>
  <script src="logic.js"></script>
  <script src="app.js"></script>
</body>
</html>
